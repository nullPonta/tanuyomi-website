<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Tanuyomi">
  <defs>
    <!-- アイコン外形（スクワークル角丸クリップ） -->
    <clipPath id="squircleClip">
      <rect width="256" height="256" rx="56"/>
    </clipPath>
    <!-- たぬき顔ベース色 -->
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA934B"/>
      <stop offset="100%" stop-color="#C87228"/>
    </linearGradient>
    <!-- 葉っぱ（高視認性エメラルドグリーン） -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <!-- 本の赤い表紙（アクセントカラー） -->
    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>

  <!-- 全領域をめいっぱい活用（角丸クリップ） -->
  <g clip-path="url(#squircleClip)">
    <!-- ベース背景（頭頂部や耳の間の隙間に見える深みのあるダークパープル） -->
    <rect width="256" height="256" fill="#181520"/>

    <!-- ===== 上部両端の耳（角丸上部の両端エリアをフル活用） ===== -->
    <!-- 左耳（濃茶 ＆ 明るいコーラルピンク内耳） -->
    <circle cx="34" cy="34" r="54" fill="#301A10"/>
    <circle cx="44" cy="44" r="30" fill="#F87171"/>

    <!-- 右耳（濃茶 ＆ 明るいコーラルピンク内耳） -->
    <circle cx="222" cy="34" r="54" fill="#301A10"/>
    <circle cx="212" cy="44" r="30" fill="#F87171"/>

    <!-- ===== たぬきの頭部（耳の間から横幅いっぱいにふっくら広がる） ===== -->
    <ellipse cx="128" cy="126" rx="106" ry="86" fill="url(#faceGrad)"/>

    <!-- ===== アイマスク（たぬきの特徴的な濃茶パッチ） ===== -->
    <ellipse cx="80" cy="118" rx="44" ry="36" transform="rotate(-12 80 118)" fill="#24130A"/>
    <ellipse cx="176" cy="118" rx="44" ry="36" transform="rotate(12 176 118)" fill="#24130A"/>

    <!-- ===== 目（極小サイズでも生き生き光る高コントラスト瞳） ===== -->
    <!-- 左目 -->
    <circle cx="86" cy="116" r="17" fill="#FFFFFF"/>
    <circle cx="87" cy="116" r="11" fill="#140A05"/>
    <circle cx="82" cy="111" r="5" fill="#FFFFFF"/>

    <!-- 右目 -->
    <circle cx="170" cy="116" r="17" fill="#FFFFFF"/>
    <circle cx="169" cy="116" r="11" fill="#140A05"/>
    <circle cx="165" cy="111" r="5" fill="#FFFFFF"/>

    <!-- ===== 白いふっくらマズル（鼻口） ===== -->
    <ellipse cx="128" cy="150" rx="44" ry="30" fill="#FFF9F2"/>
    <!-- 鼻（逆三角形・くっきり濃茶） -->
    <path d="M 115,133 Q 128,128 141,133 Q 128,148 115,133 Z" fill="#24130A"/>

    <!-- ===== 頭の葉っぱ 🍃（Tanuyomiの象徴・上部中央に鮮明配置） ===== -->
    <path d="M 128,68 C 88,40 96,6 156,12 C 180,32 164,74 128,68 Z" fill="url(#leafGrad)"/>
    <path d="M 125,52 Q 138,38 150,24" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.95"/>

    <!-- ===== 下部めいっぱいに広がる見開き本（左右端0〜256、底辺256まで全てカバー） ===== -->
    <!-- 赤いハードカバー台座（下部両端まで届く） -->
    <path d="M -4,176 L 128,196 L 260,176 L 260,260 L -4,260 Z" fill="url(#bookCoverGrad)"/>
    <!-- 見開き白ページ（左ページ） -->
    <path d="M 4,172 L 124,190 L 124,250 L 4,242 Z" fill="#FFFFFF"/>
    <!-- 見開き白ページ（右ページ・わずかな陰影で立体感） -->
    <path d="M 252,172 L 132,190 L 132,250 L 252,242 Z" fill="#F3F4F6"/>
    <!-- 中央の背表紙・折り目アクセント -->
    <path d="M 124,190 L 132,190 L 132,256 L 124,256 Z" fill="#991B1B"/>
  </g>
</svg>
