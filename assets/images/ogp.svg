<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241E2B"/>
      <stop offset="50%" stop-color="#18151D"/>
      <stop offset="100%" stop-color="#131017"/>
    </linearGradient>

    <!-- Warm Glow 1 -->
    <radialGradient id="glowWarm" cx="20%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#E68A3C" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#E68A3C" stop-opacity="0"/>
    </radialGradient>

    <!-- Red Glow 2 -->
    <radialGradient id="glowRed" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#E84141" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E84141" stop-opacity="0"/>
    </radialGradient>

    <!-- Brand Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6A868"/>
    </linearGradient>

    <!-- Filter for Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Ambient Glows -->
  <circle cx="200" cy="120" r="450" fill="url(#glowWarm)"/>
  <circle cx="1020" cy="520" r="500" fill="url(#glowRed)"/>

  <!-- Elegant Inner Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Center Content Area -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <!-- Logo Symbol & Title Group -->
    <g transform="translate(0, 0)">
      <!-- Logo Container -->
      <g transform="translate(-250, -45) scale(0.36)" filter="url(#cardShadow)">
        <!-- Squircle Base -->
        <rect width="256" height="256" rx="58" fill="#2D2833" stroke="#E68A3C" stroke-width="4"/>
        <!-- White Sticker Contour -->
        <g stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" fill="#FFFFFF">
          <circle cx="68" cy="70" r="32"/>
          <circle cx="188" cy="70" r="32"/>
          <ellipse cx="128" cy="126" rx="86" ry="74"/>
          <path d="M 128,68 C 96,44 104,12 148,20 C 168,38 156,76 128,68 Z"/>
          <path d="M 28,158 L 128,172 L 228,158 L 222,234 L 128,244 L 34,234 Z"/>
          <path d="M 144,170 L 170,178 L 160,242 L 148,234 L 138,242 Z"/>
        </g>
        <!-- Ears -->
        <circle cx="68" cy="70" r="28" fill="#3D2619"/>
        <circle cx="68" cy="70" r="18" fill="#F0C69A"/>
        <circle cx="188" cy="70" r="28" fill="#3D2619"/>
        <circle cx="188" cy="70" r="18" fill="#F0C69A"/>
        <!-- Head -->
        <ellipse cx="128" cy="126" rx="82" ry="70" fill="#E6A46C"/>
        <!-- Eye Patches -->
        <ellipse cx="90" cy="128" rx="30" ry="24" transform="rotate(-15 90 128)" fill="#3D2619"/>
        <ellipse cx="166" cy="128" rx="30" ry="24" transform="rotate(15 166 128)" fill="#3D2619"/>
        <!-- Eyes -->
        <circle cx="94" cy="128" r="10" fill="#FFFFFF"/>
        <circle cx="95" cy="128" r="6" fill="#18151D"/>
        <circle cx="97" cy="125" r="2.5" fill="#FFFFFF"/>
        <circle cx="162" cy="128" r="10" fill="#FFFFFF"/>
        <circle cx="161" cy="128" r="6" fill="#18151D"/>
        <circle cx="159" cy="125" r="2.5" fill="#FFFFFF"/>
        <!-- Snout & Nose -->
        <ellipse cx="128" cy="144" rx="22" ry="16" fill="#FFFFFF"/>
        <path d="M 122,136 L 134,136 C 136,136 137,138 136,140 L 130,146 C 129,147 127,147 126,146 L 120,140 C 119,138 120,136 122,136 Z" fill="#2D2833"/>
        <!-- Leaf on head -->
        <path d="M 128,68 C 96,44 104,12 148,20 C 168,38 156,76 128,68 Z" fill="#73E67A"/>
        <!-- Book -->
        <path d="M 28,158 L 128,172 L 228,158 L 222,234 L 128,244 L 34,234 Z" fill="#E84141"/>
        <!-- Pages -->
        <path d="M 36,162 L 128,174 L 220,162 L 216,228 L 128,238 L 42,228 Z" fill="#FFFDF8"/>
        <!-- Ribbon Bookmark -->
        <path d="M 144,170 L 170,178 L 160,242 L 148,234 L 138,242 Z" fill="#FFDE59"/>
      </g>

      <!-- Brand Typography -->
      <text x="30" y="24" font-family="'Outfit', 'Noto Sans JP', sans-serif" font-size="68" font-weight="800" fill="url(#titleGrad)" letter-spacing="1">Tanuyomi</text>
      <!-- Sub Badge -->
      <rect x="195" y="-18" width="86" height="34" rx="17" fill="#E68A3C" fill-opacity="0.2" stroke="#E68A3C" stroke-width="1.5"/>
      <text x="238" y="5" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="700" fill="#F6A868" text-anchor="middle">たぬヨミ</text>
    </g>

    <!-- Main Catchphrase -->
    <text x="0" y="125" font-family="'Noto Sans JP', sans-serif" font-size="40" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">
      PCでも、スマホでも。お気に入りの作品をどこでも心地よく。
    </text>

    <!-- Sub description -->
    <text x="0" y="180" font-family="'Noto Sans JP', sans-serif" font-size="21" font-weight="400" fill="#D1C7BD" letter-spacing="0.8">
      解凍不要・インストール不要。大容量の漫画書庫や動画をブラウザでサクサク楽しむメディアサーバー
    </text>

    <!-- 4 Key Feature Badges -->
    <g transform="translate(0, 245)">
      <!-- Badge 1: Cross Device -->
      <g transform="translate(-390, 0)">
        <rect x="0" y="0" width="180" height="52" rx="26" fill="#2C2634" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>
        <text x="90" y="33" font-family="'Noto Sans JP', sans-serif" font-size="17" font-weight="600" fill="#FDFBFA" text-anchor="middle">📱 スマホはアプリ不要</text>
      </g>
      <!-- Badge 2: No Extract -->
      <g transform="translate(-195, 0)">
        <rect x="0" y="0" width="180" height="52" rx="26" fill="#2C2634" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>
        <text x="90" y="33" font-family="'Noto Sans JP', sans-serif" font-size="17" font-weight="600" fill="#FDFBFA" text-anchor="middle">📦 ZIP・PDF解凍不要</text>
      </g>
      <!-- Badge 3: Fast Preview -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="180" height="52" rx="26" fill="#2C2634" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>
        <text x="90" y="33" font-family="'Noto Sans JP', sans-serif" font-size="17" font-weight="600" fill="#FDFBFA" text-anchor="middle">⚡ 爆速プレビュー</text>
      </g>
      <!-- Badge 4: 100 Thumbnails -->
      <g transform="translate(195, 0)">
        <rect x="0" y="0" width="195" height="52" rx="26" fill="#2C2634" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>
        <text x="97" y="33" font-family="'Noto Sans JP', sans-serif" font-size="17" font-weight="600" fill="#FDFBFA" text-anchor="middle">🎬 100サムネイルシーク</text>
      </g>
    </g>

    <!-- Bottom Platform Badge -->
    <g transform="translate(0, 345)">
      <text x="0" y="0" font-family="'Noto Sans JP', sans-serif" font-size="15" font-weight="500" fill="#9E938B">
        💻 Windows 10 / 11 対応 ｜ 単一ポータブル実行ファイル ｜ オープンソース
      </text>
    </g>
  </g>
</svg>
